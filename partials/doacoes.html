<section>
  <h2>Finalidade das Doações</h2>
  <p>As doações recebidas são fundamentais para manter e expandir nossos projetos de sustentabilidade...</p>
</section>

<main class="container">
  <h2>Formulário de Doação</h2>
  <form>
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome">

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email">

    <label for="valor">Valor da Doação (R$):</label>
    <input type="number" id="valor" name="valor" min="1" step="0.01">

    <label for="metodo">Método de Pagamento:</label>
    <select id="metodo" name="metodo">
      <option value="pix">PIX</option>
      <option value="cartao">Cartão de Crédito</option>
      <option value="boleto">Boleto Bancário</option>
    </select>

    <button type="submit">Doar</button>
  </form>
</main>
